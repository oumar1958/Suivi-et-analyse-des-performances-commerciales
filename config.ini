[DATABASE]
; Chemin vers la base de données Chinook
DB_PATH = data/chinook.db

[REPORTS]
; Répertoire de sortie pour les rapports
OUTPUT_DIR = reports/
; Format de sortie (csv, json, xlsx)
OUTPUT_FORMAT = csv

[SETTINGS]
; Langue des rapports (fr, en, etc.)
LANGUAGE = fr
; Format de date (YYYY-MM-DD, DD/MM/YYYY, etc.)
DATE_FORMAT = YYYY-MM-DD
